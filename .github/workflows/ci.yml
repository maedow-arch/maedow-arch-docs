name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  boundaries:
    name: Frontières architecturales
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # La fixture invalide est celle qui prouve quelque chose : cinq imports
      # interdits doivent produire cinq erreurs. Une config qui ne matche rien
      # passerait le test positif sans rien vérifier.
      - run: npm run test:boundaries

  # Douze assertions couvrent en deux secondes ce que vingt jobs d'intégration
  # ne voyaient pas : la matrice n'exerçait qu'un profil pour le générateur de
  # domaine, et que des noms d'un seul mot.
  cli:
    name: Noyau de la CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
        working-directory: packages/create-maedow-arch-app

  format:
    name: Formatage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Prettier formate le code, pas la prose : le corpus est exclu, et
      # .gitattributes normalise les fins de ligne pour que ce contrôle ne
      # dépende pas du système de celui qui commite.
      - run: npm run format:check

  site:
    name: Build du site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      # `prebuild` régénère les .mdx depuis les .md de la racine : ce job vérifie
      # donc aussi que le corpus reste convertible.
      - run: npm run build
        working-directory: site

  # Chaque variante du template est vérifiée sous chaque gestionnaire de
  # paquets. Sans cette matrice, une combinaison se met à pourrir en silence :
  # c'est le mode de défaillance que documente FRICTIONS.md, de bout en bout.
  scaffold:
    name: ${{ matrix.framework }}/${{ matrix.mode }}/${{ matrix.template }}/${{ matrix.css }} sous ${{ matrix.pm }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Les combinaisons sont vérifiées sous npm, et quatre entrées
      # supplémentaires couvrent pnpm et bun. Croiser les quatre axes avec les
      # trois gestionnaires donnerait quarante-huit jobs, ce qui deviendrait le
      # prochain pourrissement silencieux plutôt qu'un garde-fou.
      matrix:
        framework: [next, vite]
        mode: [full, light]
        template: [demo, blank]
        css: [vanilla, tailwind]
        pm: [npm]
        include:
          - { framework: next, mode: full, template: demo, css: tailwind, pm: pnpm }
          - { framework: next, mode: full, template: demo, css: vanilla, pm: bun }
          - { framework: vite, mode: full, template: demo, css: tailwind, pm: bun }
          - { framework: vite, mode: light, template: demo, css: vanilla, pm: pnpm }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - if: matrix.pm == 'pnpm'
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - if: matrix.pm == 'bun'
        uses: oven-sh/setup-bun@v2

      # On construit le bundle et on génère avec lui, pas avec la source : c'est
      # l'artefact que l'utilisateur reçoit. La source, elle, importe
      # @clack/prompts depuis node_modules, ce que le paquet publié ne fait pas.
      - name: Construire la CLI
        working-directory: packages/create-maedow-arch-app
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Générer le projet
        run: node packages/create-maedow-arch-app/dist/create-maedow-arch-app.mjs app --framework ${{ matrix.framework }} --mode ${{ matrix.mode }} --template ${{ matrix.template }} --css ${{ matrix.css }}

      # La config ESLint est empaquetée puis installée depuis son tarball, et
      # non liée par `file:`. npm et bun résolvent un lien `file:` par un
      # symlink : le paquet cherche alors ses peerDependencies depuis son
      # emplacement réel, où elles n'existent pas. Un tarball reproduit
      # exactement ce qu'un utilisateur reçoit du registre.
      - name: Empaqueter la config ESLint locale
        run: npm pack --pack-destination "$RUNNER_TEMP"
        working-directory: packages/eslint-config-maedow-arch

      - name: Installer
        working-directory: app
        run: |
          TARBALL=$(ls "$RUNNER_TEMP"/eslint-config-maedow-arch-*.tgz | head -1)
          npm pkg set devDependencies.eslint-config-maedow-arch="file:$TARBALL"
          ${{ matrix.pm == 'npm' && 'npm install --no-audit --no-fund' || '' }}${{ matrix.pm == 'pnpm' && 'pnpm install' || '' }}${{ matrix.pm == 'bun' && 'bun install' || '' }}

      - name: Lint, typecheck, build
        working-directory: app
        run: |
          npm run lint
          npm run typecheck
          npm run build

      # Seul le profil full embarque des tests de domaine : en Light, les
      # règles vivent dans la feature et la démonstration n'en fournit pas.
      - name: Tests du domaine
        if: matrix.template == 'demo' && matrix.mode == 'full'
        working-directory: app
        run: npm run test

      # Les noms comportent un tiret. C'est l'angle mort qui a laissé passer un
      # défaut produisant du TypeScript invalide : la matrice n'exerçait que des
      # noms d'un seul mot, sur lesquels la pascalisation fautive fonctionnait.
      - name: Générateurs de features, noms simples et composés
        working-directory: app
        run: |
          npm run generate:feature checkout
          npm run generate:feature user-profile
          test -f src/features/user-profile/UserProfile.test.tsx
          npm run lint

      # Le générateur de domaine tourne dans les deux profils, et c'est le
      # second angle mort : il n'était lancé qu'en Full, alors qu'en Light il
      # écrivait un import vers un fichier absent.
      #
      # En Light, la couche domaine n'existe pas encore : le premier domaine la
      # fait naître, et le projet bascule vers Full. L'ordre compte, la
      # vérification d'absence doit précéder la première génération.
      - name: Domaine, et bascule du profil Light vers Full
        working-directory: app
        run: |
          if [ "${{ matrix.mode }}" = "light" ]; then
            test ! -d src/core || (echo "::error::Un projet Light ne devrait pas avoir de couche core." && exit 1)
          fi
          npm run generate:domain order-item
          test -f src/core/common/result.ts
          npm run generate:domain billing
          npm run typecheck
          npm run lint

      # La violation testée diffère selon le profil, mais l'exigence est la
      # même : le lint doit échouer. Un lint vert ici signalerait une
      # configuration inactive, le mode de défaillance décrit en F-001.
      - name: Test négatif, un import interdit doit faire échouer le lint
        working-directory: app
        run: |
          npm run generate:feature autre
          if [ "${{ matrix.mode }}" = "full" ]; then
            cat > src/core/billing/violation.ts <<'EOF'
          import { CheckoutScreen } from "../../features/checkout/Screen";
          export const boom = () => CheckoutScreen();
          EOF
          else
            cat > src/features/checkout/violation.ts <<'EOF'
          import { AutreScreen } from "../autre/Screen";
          export const boom = () => AutreScreen();
          EOF
          fi
          if npm run lint; then
            echo "::error::Le lint est passé alors qu'un import interdit était présent. Les frontières ne sont pas appliquées en ${{ matrix.framework }}/${{ matrix.mode }}/${{ matrix.css }} sous ${{ matrix.pm }}."
            exit 1
          fi
          echo "Violation correctement détectée en ${{ matrix.framework }}/${{ matrix.mode }}/${{ matrix.css }} sous ${{ matrix.pm }}."
