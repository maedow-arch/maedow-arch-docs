name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  boundaries:
    name: Frontières architecturales
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # La fixture invalide est celle qui prouve quelque chose : cinq imports
      # interdits doivent produire cinq erreurs. Une config qui ne matche rien
      # passerait le test positif sans rien vérifier.
      - run: npm run test:boundaries

  site:
    name: Build du site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      # `prebuild` régénère les .mdx depuis les .md de la racine : ce job vérifie
      # donc aussi que le corpus reste convertible.
      - run: npm run build
        working-directory: site

  scaffold:
    name: Projet généré
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Générer un projet depuis la CLI locale
        run: |
          node packages/create-maedow-arch-app/bin/create-maedow-arch-app.mjs demo
          cd demo
          npm pkg set devDependencies.eslint-config-maedow-arch=file:../packages/eslint-config-maedow-arch
          npm install --no-audit --no-fund
      - name: Générateurs, lint, typecheck, build
        working-directory: demo
        run: |
          npm run generate:domain billing
          npm run generate:feature checkout
          npm run lint
          npm run typecheck
          npm run build
      - name: Test négatif, un import interdit doit faire échouer le lint
        working-directory: demo
        run: |
          cat > src/core/billing/violation.ts <<'EOF'
          import { CheckoutScreen } from "../../features/checkout/Screen";
          export const boom = () => CheckoutScreen();
          EOF
          if npm run lint; then
            echo "::error::Le lint est passé alors qu'un import interdit était présent. Les frontières ne sont pas appliquées."
            exit 1
          fi
          echo "Violation correctement détectée."
